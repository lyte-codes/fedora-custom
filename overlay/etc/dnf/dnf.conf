[main]
gpgcheck=1

# The single highest-leverage setting for a low-overhead system.
#
# Fedora packages declare "Recommends", and dnf installs them by default. That
# is how asking for one small tool quietly pulls in a documentation set, a GUI
# front-end and a translation bundle. Off by default here, so every package you
# add brings what it NEEDS and nothing it merely suggests.
#
# It lives in the overlay rather than in a module so it applies to every layer
# built on top of this image, and to anything installed on the running machine
# later -- not just to the modules below.
#
# If a package genuinely breaks without a recommended dependency, install that
# dependency by name. Being explicit is the point.
install_weak_deps=False

# No point carrying documentation for packages on an appliance-style system.
# Comment this out if this becomes a machine you read man pages on.
tsflags=nodocs

clean_requirements_on_remove=True
skip_if_unavailable=False
