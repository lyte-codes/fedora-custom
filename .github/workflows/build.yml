name: Build custom Fedora

# Built on GitHub's runners rather than locally because the target is x86_64
# and every machine in this house is ARM. Emulating x86 turns a 20-minute build
# into an overnight one; a runner does it natively for free.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Preset to build'
        default: 'desktop'
        type: choice
        options: [desktop, desktop-plasma, minimal, normal, max]
      modules:
        description: 'Override the profile entirely (space separated, optional)'
        default: ''
        type: string
      drivers:
        description: 'GPU drivers: amd, intel, nvidia, or empty for none'
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # The one profile allowed to claim :latest -- i.e. what a running machine
  # gets from `bootc upgrade`. This is the daily driver, so it is the headed
  # one; the headless profiles are built on demand and never touch :latest.
  CANONICAL_PROFILE: desktop

jobs:
  build:
    runs-on: ubuntu-latest          # x86_64 -- the whole point
    permissions:
      contents: read
      packages: write               # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Runners start with ~14GB free, and an OS image build will exhaust that
      # partway through and fail with a confusing error. This reclaims ~20GB of
      # preinstalled toolchains nothing here uses. Cheap insurance.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Build image
        id: build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'desktop' }}"
          MODULES="${{ github.event.inputs.modules || '' }}"
          DRIVERS="${{ github.event.inputs.drivers || '' }}"
          echo "profile: $PROFILE"
          echo "modules: ${MODULES:-<from profile>}"
          echo "drivers: ${DRIVERS:-<none>}"
          # Tagging rules matter more than they look.
          #
          # :latest is what a running machine upgrades against, so it must mean
          # exactly one thing: the canonical daily-driver build. Tagging it
          # unconditionally meant a one-off `max` build from the Actions button
          # silently redefined what every PC would install on next reboot.
          #
          # So: every build gets its :<profile> tag. Only the canonical profile
          # additionally claims :latest and the commit tag.
          TAGS="-t ${REGISTRY}/${IMAGE,,}:${PROFILE}"
          if [ "$PROFILE" = "$CANONICAL_PROFILE" ]; then
            TAGS="$TAGS -t ${REGISTRY}/${IMAGE,,}:latest"
            TAGS="$TAGS -t ${REGISTRY}/${IMAGE,,}:${GITHUB_SHA::7}"
            echo "canonical profile -> also tagging :latest and :${GITHUB_SHA::7}"
          else
            echo "non-canonical profile -> tagging :${PROFILE} only, leaving :latest alone"
          fi

          podman build \
            --build-arg PROFILE="$PROFILE" \
            --build-arg MODULES="$MODULES" \
            --build-arg DRIVERS="$DRIVERS" \
            --platform linux/amd64 \
            $TAGS \
            .
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"

      # Size is a feature here. Printing it every build makes a regression
      # visible in the log the day it happens, rather than the day you notice
      # the ISO got fat.
      - name: Report image size
        run: podman images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | head -5

      # Pull requests build but must not publish -- otherwise anyone opening a
      # PR against this repo can push an image your PC would later install.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          # Push exactly the tags the build step decided on -- deriving them
          # again here is how the two lists drift apart.
          for t in $(echo "$TAGS" | tr ' ' '\n' | grep -v '^-t$' | grep .); do
            podman push "$t"
            echo "pushed $t"
          done
